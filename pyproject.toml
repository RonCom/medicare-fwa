[project]
name = "medicare-fwa"
version = "0.1.0"
description = "Peer-benchmarked outlier detection on public Medicare data, validated against OIG exclusions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.1",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "streamlit>=1.38",
    "plotly>=5.22",
    "openpyxl>=3.1",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
]

[project.scripts]
fwa = "fwa.__main__:main"

[dependency-groups]
dev = ["ipykernel>=6.29", "ruff>=0.6"]
experiments = ["xgboost>=2.0", "pyod>=2.0"]
snowflake = ["dbt-snowflake>=1.9", "snowflake-connector-python[pandas]>=3.12", "cryptography>=42"]

[tool.uv]
# install every group on a plain `uv sync` / `uv run`, so syncing one group never removes another
default-groups = ["dev", "experiments", "snowflake"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fwa"]
